name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'config.js', 'manifest.json', 'sw.js', '.github/workflows/build-apk.yml', 'google-services.json', 'debug.keystore']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Android
        run: |
          mkdir -p apk/www && cd apk
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          GS=false; [ -f ../google-services.json ] && GS=true
          if [ "$GS" = true ]; then npm i @capacitor-firebase/authentication@6 firebase@10; else echo '::error::google-services.json TIDAK ADA di root repo (nama harus persis google-services.json). Tanpa file ini login Google pasti gagal.'; exit 1; fi
          echo '<!doctype html><title>Kas Kelas</title>' > www/index.html
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          node -e "const c={appId:'com.kaskelas.app',appName:'Kas Kelas',webDir:'www',server:{url:process.argv[1],androidScheme:'https'}};if(process.argv[2]==='true')c.plugins={FirebaseAuthentication:{skipNativeAuth:true,providers:['google.com']}};require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c))" "$SITE" "$GS"
          npx cap add android
          if [ "$GS" = true ]; then cp ../google-services.json android/app/google-services.json; fi
          npx cap sync android
          grep -q FirebaseAuthentication android/app/src/main/assets/capacitor.plugins.json || { echo '::error::Plugin FirebaseAuthentication tidak terdaftar di APK'; exit 1; }
          grep -q google-services android/app/build.gradle || { echo '::error::google-services belum aktif di build.gradle'; exit 1; }
          mkdir -p ~/.android
          [ -f ../debug.keystore ] && cp ../debug.keystore ~/.android/debug.keystore || echo 'debug.keystore belum ada, memakai kunci sementara'
      - name: Pasang ikon aplikasi
        run: |
          command -v convert > /dev/null || sudo apt-get install -y imagemagick
          R=apk/android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n a f <<< "$d"
            convert icon-512.png -resize ${a}x${a} $R/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${a}x${a} $R/mipmap-$n/ic_launcher_round.png
            convert icon-maskable-512.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#13B5A5</color></resources>' > $R/values/ic_launcher_background.xml
      - name: Atur layar penuh
        run: |
          D=apk/android/app/src/main/java/com/kaskelas/app
          mkdir -p $D
          cat > $D/MainActivity.java <<'EOF'
          package com.kaskelas.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              if (Build.VERSION.SDK_INT >= 28) w.getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) { w.setStatusBarContrastEnforced(false); w.setNavigationBarContrastEnforced(false); }
              w.getDecorView().setBackgroundColor(Color.parseColor("#F2FAF8"));
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.setAppearanceLightStatusBars(true);
              c.setAppearanceLightNavigationBars(true);
              View root = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets s = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets k = insets.getInsets(WindowInsetsCompat.Type.ime());
                v.setPadding(s.left, s.top, s.right, Math.max(s.bottom, k.bottom));
                return WindowInsetsCompat.CONSUMED;
              });
              ViewCompat.requestApplyInsets(root);
            }
          }
          EOF
      - name: Build APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../kas-kelas.apk
      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kas Kelas v${{ github.run_number }}
          files: kas-kelas.apk
