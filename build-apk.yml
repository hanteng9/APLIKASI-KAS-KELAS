name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'config.js', 'manifest.json', 'sw.js', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Android
        run: |
          mkdir -p apk/www && cd apk
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '<!doctype html><title>Kas Kelas</title>' > www/index.html
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.kaskelas.app',appName:'Kas Kelas',webDir:'www',server:{url:process.argv[1],androidScheme:'https'}}))" "$SITE"
          npx cap add android
      - name: Build APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../kas-kelas.apk
      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kas Kelas v${{ github.run_number }}
          files: kas-kelas.apk
